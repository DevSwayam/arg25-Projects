[phases.setup]
nixPkgs = ["nodejs-18_x", "curl"]

[phases.install]
cmds = [
  "curl -fsSL https://bun.sh/install | bash",
  "export PATH=\"$HOME/.bun/bin:$PATH\"",
  "cd unwallet-bond-credit 2>/dev/null || true",
  "bun install"
]

[start]
cmd = "export PATH=\"$HOME/.bun/bin:$PATH\" && cd unwallet-bond-credit 2>/dev/null || true && bun run poll-server.ts"

